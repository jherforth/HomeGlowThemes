<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <style>.s{animation:turn 100s linear infinite}.c{animation:turn 70s linear infinite}@keyframes turn{to{transform:translateX(-200px)}}@media (prefers-reduced-motion: reduce){.s,.c{animation:none}}</style>
  <defs>
